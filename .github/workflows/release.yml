name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the app version
        run: test "v$(node -p 'require("./apps/desktop/package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build and upload to a draft release
        run: |
          pnpm turbo run build --filter=@repo/desktop
          pnpm --filter @repo/desktop package:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the app's seal
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/release/mac-arm64/Cube Goblin.app"
      - name: Publish as latest
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
